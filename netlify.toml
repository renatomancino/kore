# Netlify builds this site from the machine that runs `netlify deploy --build`,
# so the Next.js adapter has to be a real dependency: the automatic install only
# happens on Netlify's own build servers, which we are not using yet.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Finche' il sito vive solo sul sottodominio .netlify.app e' un cantiere: mezza
# pagina servizi e' ancora da scrivere e i recapiti mancano. Questo lo tiene
# fuori dai motori di ricerca.
# DA TOGLIERE il giorno che si collega il dominio vero, altrimenti il sito
# resta invisibile su Google.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
